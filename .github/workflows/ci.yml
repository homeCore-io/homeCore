name: CI

# This is the only CI in the tree, and it needed no change to become that.
#
# rust-ci.yml runs `cargo fmt --all`, `cargo clippy --all-targets
# --all-features` and `cargo test --all-features` at the repo root. The root is
# a virtual workspace, so each of those already covers every member — the
# server, the 17 crates, the SDK and all thirteen plugins. The thirteen
# per-plugin copies of this file were deleted in phase 2 as redundant, not as a
# gap to fill later.
#
# It also means feature unification is now honest: a plugin that compiled only
# because a sibling happened to enable a feature fails here, which is exactly
# how hc-hue's missing `schema` feature escaped local builds and reached CI.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# The default workflow token is read-only, and a called workflow can never hold
# more than its caller. rust-ci.yml opens/closes a tracking issue when develop
# goes red, so without issues:write granted here the whole run fails at startup
# with no jobs and no annotation.
permissions:
  contents: read
  issues: write

jobs:
  ci:
    # No rust_version override — take rust-ci.yml's pinned default so CI
    # compiles with the same toolchain that ships (the Dockerfiles pin
    # rust:1.95-alpine by digest). Tracking "stable" here gated merges on a
    # compiler we never ship with, and turned CI red on Rust release day with
    # no code change. Bump the pin in hc-scripts deliberately.
    uses: homeCore-io/hc-scripts/.github/workflows/rust-ci.yml@main
