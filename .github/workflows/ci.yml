# CI for the plugin template.
#
# The same reusable workflow every plugin uses, on the same pinned toolchain —
# a template that does not build the way real plugins are built is worse than
# no template, because the first thing it teaches is wrong.
#
# There is deliberately no release workflow here. This repo is a starting
# point, not a plugin: nobody installs `hc-plugin-template` from the registry,
# so it has nothing to publish.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# The default workflow token is read-only, and a called workflow can never hold
# more than its caller. rust-ci.yml opens/closes a tracking issue when develop
# goes red, so without issues:write granted here the whole run fails at startup
# with no jobs and no annotation.
permissions:
  contents: read
  issues: write

jobs:
  ci:
    # No rust_version override — take rust-ci.yml's pinned default, the same
    # toolchain the plugins compile against.
    uses: homeCore-io/hc-scripts/.github/workflows/rust-ci.yml@main
