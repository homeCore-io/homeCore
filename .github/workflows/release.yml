name: Release

on:
  push:
    branches: [develop]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
  workflow_dispatch:
    inputs:
      fast:
        description: "Skip aarch64 to halve runtime (use for dev iteration; tag pushes always go multi-arch)."
        type: boolean
        default: true
      refresh_deps:
        description: "Run cargo update for in-org git deps (plugin-sdk-rs, hc-types, hc-logging, hc-time) before build. SDK fanout passes this so the rebuild actually carries new SDK code instead of the SHA Cargo.lock pins."
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: homeCore-io/hc-scripts/.github/workflows/rust-release.yml@main
    # Inherit org-level secrets (CROSS_REPO_DISPATCH_PAT) so the reusable
    # workflow can cascade to homeCore-io/docker on develop pushes.
    secrets: inherit
    with:
      binary_name: hc-lutron
      config_example: config/config.toml.example
      rust_version: "stable"
      publish_docker_image: false
      # The Dockerfile and entrypoints that build the published image come from
      # homeCore-io/docker at this ref, so it is part of the build recipe — not
      # just orchestration. Hardcoding `develop` meant a *tagged* image was built
      # from whatever that branch happened to be at the time, so the image could
      # not be rebuilt from the component's tag alone: its recipe was unrecorded.
      #
      # On a tag push, pin to the identical tag. homeCore-io/docker is versioned
      # in lockstep (it carries v0.1.0-v0.1.5), so tagging this component v0.1.6
      # builds against docker v0.1.6. Everything else keeps tracking develop,
      # which is what a dev image wants.
      #
      # Ordering is now explicit: tag homeCore-io/docker before tagging this
      # component. If the tag is missing the release fails — hc-scripts'
      # pre-flight names the cause — rather than silently building from develop.
      docker_repo_ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'develop' }}
      fast: ${{ inputs.fast || false }}
      refresh_deps: ${{ inputs.refresh_deps || false }}
