name: Release

on:
  push:
    branches: [develop]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
  workflow_dispatch:
    inputs:
      fast:
        description: "Skip aarch64 to halve runtime (dev iteration; tag pushes always go multi-arch)."
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    uses: homeCore-io/hc-scripts/.github/workflows/rust-release.yml@main
    # Inherit org secrets (REGISTRY_DISPATCH_PAT) so the reusable workflow can
    # notify homeCore-io/registry to index this release's artifact.
    secrets: inherit
    with:
      binary_name: hc-lutron
      config_example: config/config.toml.example
      rust_version: "stable"
      # Plugins ship as signed registry artifacts (tar.zst), not containers: on
      # a tag release, package the binary, attach it to the GitHub Release, and
      # notify the plugin registry to index it.
      publish_registry: true
      fast: ${{ inputs.fast || false }}
