name: Release

on:
  push:
    branches: [develop]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
  workflow_dispatch: {}

# contents: write — reusable workflow's release job creates a GH Release.
# packages: write — reusable workflow's docker-publish job pushes to ghcr.io.
permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: homeCore-io/hc-scripts/.github/workflows/rust-release.yml@main
    secrets: inherit
    with:
      binary_name: homecore
      config_example: config/homecore.toml.example
      extra_files: |
        config/profiles
        scripts/service-templates/homecore.service
      rust_version: "stable"
      # Docker image: hc-core (binary is "homecore", image name diverges).
      #
      # hc-core is the API and the embedded broker. Nothing else.
      #
      # It used to also clone hc-web-leptos, compile it to WASM, and bake the
      # bundle in; and a second job merged core with every plugin's release
      # tarball into an "appliance" image. Neither describes the product any
      # more. The UI is hc-web — its own image, its own repo, serving the app
      # and proxying /api/v1 to core. Plugins install at runtime from the signed
      # registry. So core builds one binary and one image, and nothing here
      # builds a UI core does not own.
      publish_docker_image: true
      image_name: hc-core
      dockerfile_name: Dockerfile.core
      # The Dockerfile and entrypoint that build the published image come from
      # homeCore-io/docker at this ref, so it is part of the build recipe — not
      # just orchestration. Hardcoding `develop` meant a *tagged* image was built
      # from whatever that branch happened to be at the time, so the image could
      # not be rebuilt from the component's tag alone: its recipe was unrecorded.
      #
      # On a tag push, pin to the identical tag. homeCore-io/docker is versioned
      # in lockstep (it carries v0.1.0-v0.1.5), so tagging this component v0.1.6
      # builds against docker v0.1.6. Everything else keeps tracking develop,
      # which is what a dev image wants.
      #
      # This is now the ONLY cross-repo ordering constraint a release has: tag
      # homeCore-io/docker before tagging core. If the tag is missing the release
      # fails — hc-scripts' pre-flight names the cause — rather than silently
      # building from develop.
      docker_repo_ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'develop' }}
