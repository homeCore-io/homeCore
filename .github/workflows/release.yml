name: Release

on:
  push:
    branches: [develop]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
  workflow_dispatch: {}

# contents: write — reusable workflow's release job creates a GH Release.
# packages: write — reusable workflow's docker-publish job pushes to ghcr.io.
permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: homeCore-io/hc-scripts/.github/workflows/rust-release.yml@main
    secrets: inherit
    with:
      binary_name: homecore
      config_example: config/homecore.toml.example
      extra_files: |
        config/profiles
        scripts/service-templates/homecore.service
      rust_version: "stable"
      # Docker image: hc-core (binary is "homecore", image name diverges).
      #
      # hc-core is the API and the embedded broker. Nothing else.
      #
      # It used to also clone hc-web-leptos, compile it to WASM, and bake the
      # bundle in; and a second job merged core with every plugin's release
      # tarball into an "appliance" image. Neither describes the product any
      # more. The UI is hc-web — its own image, its own repo, serving the app
      # and proxying /api/v1 to core. Plugins install at runtime from the signed
      # registry. So core builds one binary and one image, and nothing here
      # builds a UI core does not own.
      publish_docker_image: true
      image_name: hc-core
      dockerfile_name: Dockerfile.core
      # The Dockerfile and entrypoint that build the published image live in
      # this repo, so they are versioned with the binary they wrap: this tag
      # alone reproduces the image, and the release has NO cross-repo ordering
      # constraint at all.
      #
      # They used to come from homeCore-io/docker, pinned to core's own tag name
      # so the recipe behind a tagged image was recorded. That worked, but it
      # required tagging that repo before this one on every release — and since
      # it has no version of its own, those tags were empty re-cuts whose only
      # purpose was to satisfy this pin. The coupling dated from when core baked
      # the Leptos WASM UI in and three repos genuinely had to agree; core builds
      # one binary and one image now.
      #
      # Provenance is recorded in the image instead of inferred from matching tag
      # names: hc-scripts stamps org.opencontainers.image.revision with the
      # commit, which pins the Dockerfile and the source together.
      docker_context_dir: docker
