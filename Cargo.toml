# The root of this repository is a workspace and nothing else. The server
# binary is a member like any other crate — see `homecore/`.
#
# A workspace root that is *also* a package makes "build everything" and "build
# the server" ambiguous: `cargo test` at the root tested the *current package*,
# which was the binary, so every crate's tests were invisible to CI. That was
# worked around with a `default-members` list duplicating `members`. With no
# root package there is nothing to disambiguate and the list is gone — the
# workspace is the default unit of work for build, test and clippy alike.

[workspace]
resolver = "2"
members = [
    "homecore",
    "sdk/rust",
    "runtime-host",
    "plugins/hc-caseta",
    "plugins/hc-captest",
    "plugins/hc-ecowitt",
    "plugins/hc-hue",
    "plugins/hc-isy",
    "plugins/hc-lutron",
    "plugins/hc-plugin-template",
    "plugins/hc-roku",
    "plugins/hc-sonos",
    "plugins/hc-thermostat",
    "plugins/hc-wled",
    "plugins/hc-yolink",
    "plugins/hc-zwave",
    "crates/hc-types",
    "crates/hc-broker",
    "crates/hc-mqtt-client",
    "crates/hc-topic-map",
    "crates/hc-core",
    "crates/hc-state",
    "crates/hc-api",
    "crates/hc-web-admin",
    "crates/hc-auth",
    "crates/hc-api-types",
    "crates/hc-cli",
    "crates/hc-scripting",
    "crates/hc-notify",
    "crates/hc-logging",
    "crates/hc-influx",
    "crates/hc-config",
    "crates/hc-time",
]

[workspace.dependencies]
# HTTP client. Used by hc-core (CallService / RunScript http_get) and by hc-api's
# media-art proxy. rustls rather than native-tls so the musl/alpine images build
# without OpenSSL.
reqwest       = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio             = { version = "1", features = ["full"] }
rumqttd           = "0.20"
rumqttc           = "0.25"
axum              = { version = "0.8", features = ["ws"] }
redb              = "4"
rusqlite          = { version = "0.40", features = ["bundled"] }
rhai              = { version = "1", features = ["sync"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
uuid              = { version = "1", features = ["v4", "serde"] }
chrono            = { version = "0.4", features = ["serde"] }
chrono-tz         = "0.9"
anyhow            = "1"
thiserror         = "2"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender   = "0.2"
ipnet              = { version = "2", features = ["serde"] }
toml              = "1"
ron               = "0.12"
# Derives the rule vocabulary from the rule types. See hc-types' `schema` feature.
schemars          = { version = "1", features = ["chrono04", "uuid1"] }
argon2            = { version = "0.5", features = ["password-hash"] }
rand              = { version = "0.10", features = ["std_rng"] }
async-trait       = "0.1"
# 8, not 6. Bumped with tokio-tungstenite because both are the same kind of
# change: a version everything else in the tree already agrees on.
notify            = "8"
prometheus        = { version = "0.14", default-features = false, features = ["process"] }
dashmap           = "6"
cron              = "0.17"
icalendar         = { version = "0.16", default-features = false, features = ["parser"] }

# Size-optimized release profile. Applies workspace-wide.
# Strip removes debug symbols (~30-50% binary size reduction).
# thin LTO catches cross-crate inlining without the build-time cost of
# fat LTO. codegen-units=1 enables better inlining; trade compile time
# for runtime + size. panic=unwind kept (default) so async tasks can
# unwind cleanly under tokio without killing the whole daemon.
[profile.release]
strip         = "symbols"
lto           = "thin"
codegen-units = 1

# There is no [patch] section any more, and that is the point of phase 2.
#
# It existed because hc-captest and the SDK reached back into this repo for
# hc-types/hc-logging/hc-time over git, so cargo saw two copies of each — the
# git one and the one in crates/ — and streaming_test.rs failed with
# 'expected hc_types::Capabilities, found Capabilities'. The patch forced them
# together. Now every one of those edges is a path dependency inside this
# workspace, so there is nothing to unify.
