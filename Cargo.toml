[package]
name        = "hc-lutron"
version     = "0.1.11"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Lutron RadioRA2 plugin for homeCore"
repository  = "https://github.com/homeCore-io/hc-lutron"

[[bin]]
name = "hc-lutron"
path = "src/main.rs"

[dependencies]
schemars           = { version = "0.8", optional = true }
plugin-sdk-rs      = { git = "https://github.com/homeCore-io/hc-plugin-sdk-rs", tag = "v0.3.10" }
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "1"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
flate2           = "1"
chrono           = "0.4"
uuid         = { version = "1", features = ["v4"] }
# DbXmlInfo.xml discovery. reqwest matches the fleet's HTTP client; roxmltree
# is hc-sonos's DOM parser, and this parse is ancestry-heavy (a device's room
# is its nearest enclosing <Area>), which a streaming reader makes painful.
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roxmltree    = "0.18"

[features]
default = ["schema"]
schema = ["dep:schemars"]
