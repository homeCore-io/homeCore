# The root of this repository is a workspace and nothing else. The server
# binary is a member like any other crate — see `homecore/`.
#
# A workspace root that is *also* a package makes "build everything" and "build
# the server" ambiguous: `cargo test` at the root tested the *current package*,
# which was the binary, so every crate's tests were invisible to CI. That was
# worked around with a `default-members` list duplicating `members`. With no
# root package there is nothing to disambiguate and the list is gone — the
# workspace is the default unit of work for build, test and clippy alike.

[workspace]
resolver = "2"
members = [
    "homecore",
    "crates/hc-types",
    "crates/hc-broker",
    "crates/hc-mqtt-client",
    "crates/hc-topic-map",
    "crates/hc-core",
    "crates/hc-state",
    "crates/hc-api",
    "crates/hc-web-admin",
    "crates/hc-auth",
    "crates/hc-api-types",
    "crates/hc-cli",
    "crates/hc-scripting",
    "crates/hc-notify",
    "crates/hc-logging",
    "crates/hc-influx",
    "crates/hc-config",
    "crates/hc-time",
]

[workspace.dependencies]
# HTTP client. Used by hc-core (CallService / RunScript http_get) and by hc-api's
# media-art proxy. rustls rather than native-tls so the musl/alpine images build
# without OpenSSL.
reqwest       = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio             = { version = "1", features = ["full"] }
rumqttd           = "0.20"
rumqttc           = "0.25"
axum              = { version = "0.7", features = ["ws"] }
redb              = "2"
rusqlite          = { version = "0.31", features = ["bundled"] }
rhai              = { version = "1", features = ["sync"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
uuid              = { version = "1", features = ["v4", "serde"] }
chrono            = { version = "0.4", features = ["serde"] }
chrono-tz         = "0.9"
anyhow            = "1"
thiserror         = "2"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender   = "0.2"
ipnet              = { version = "2", features = ["serde"] }
jsonschema        = "0.18"
toml              = "1"
ron               = "0.8"
# Derives the rule vocabulary from the rule types. See hc-types' `schema` feature.
schemars          = { version = "0.8", features = ["chrono", "uuid1"] }
argon2            = { version = "0.5", features = ["password-hash"] }
rand              = { version = "0.8", features = ["std_rng"] }
async-trait       = "0.1"
notify            = "6"
prometheus        = { version = "0.14", default-features = false, features = ["process"] }
dashmap           = "6"
cron              = "0.12"
icalendar         = { version = "0.16", default-features = false, features = ["parser"] }

# Size-optimized release profile. Applies workspace-wide.
# Strip removes debug symbols (~30-50% binary size reduction).
# thin LTO catches cross-crate inlining without the build-time cost of
# fat LTO. codegen-units=1 enables better inlining; trade compile time
# for runtime + size. panic=unwind kept (default) so async tasks can
# unwind cleanly under tokio without killing the whole daemon.
[profile.release]
strip         = "symbols"
lto           = "thin"
codegen-units = 1

# ---------------------------------------------------------------------------
# Cross-repo dep unification
#
# hc-captest (git dep, dev-only) transitively depends on hc-types/hc-logging
# from homeCore-io/homeCore. Without this patch, cargo would resolve those
# as a separate copy of the crates from the git source and the in-workspace
# copy from `crates/`, producing E0308 'expected hc_types::Capabilities,
# found Capabilities' in streaming_test.rs.
#
# [patch] is only honoured in the workspace root manifest, so it stays here
# even though the dev-dependency that needs it lives in homecore/.
# ---------------------------------------------------------------------------
[patch."https://github.com/homeCore-io/homeCore"]
hc-types     = { path = "crates/hc-types" }
hc-logging   = { path = "crates/hc-logging" }
hc-api-types = { path = "crates/hc-api-types" }
hc-auth      = { path = "crates/hc-auth" }
hc-time      = { path = "crates/hc-time" }
