[package]
name        = "hc-cli"
version     = "0.1.5"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Script and administer homeCore from the command line"
repository  = "https://github.com/homeCore-io/homeCore"

[[bin]]
name = "hc-cli"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
hc-api-types = { path = "../hc-api-types" }
hc-auth      = { path = "../hc-auth" }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
toml         = { workspace = true }
anyhow       = { workspace = true }
tracing      = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
clap         = { version = "4", features = ["derive", "env"] }
reqwest      = { version = "0.13", default-features = false, features = ["json", "rustls"] }
hyper        = { version = "1", features = ["client", "http1"] }
hyper-util   = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
hyperlocal   = "0.9"
bytes        = "1"
rpassword    = "7"
dirs         = "6"
rand               = { workspace = true }
tracing-subscriber = { workspace = true }
percent-encoding   = "2"
futures-util       = "0.3"
libc               = "0.2"
tokio-tungstenite  = { version = "0.29", features = ["connect", "rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = "3"
