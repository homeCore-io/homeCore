[package]
name = "hc-api-types"
version = "0.1.4"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Shared request/response types for the homeCore REST API"
repository = "https://github.com/homeCore-io/homeCore"

[dependencies]
hc-auth = { path = "../hc-auth" }
serde   = { workspace = true }
uuid    = { workspace = true }
chrono  = { workspace = true }

[dev-dependencies]
# For asserting the wire form — a pending enrollment must omit `credentials`
# rather than send a null a client could misread.
serde_json = { workspace = true }
