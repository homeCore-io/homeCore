[package]
name    = "hc-auth"
version = "0.1.4"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
tracing    = { workspace = true }
hc-types   = { path = "../hc-types" }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
bcrypt = "0.19.0"
argon2     = { workspace = true }
# getrandom directly, not rand/rand_core. Every use here is "give me N bytes
# from the OS CSPRNG", which is what rand_core::OsRng was wrapping anyway —
# and rand renamed that type twice between 0.8 and 0.10 (OsRng -> SysRng,
# RngCore off the root). bcrypt already pulls this exact version, so it costs
# nothing. argon2 0.5.3 is still the newest release and still pins
# password-hash 0.5, which is why the salt is encoded by hand below rather
# than via SaltString::generate(&mut OsRng).
getrandom  = "0.4"
base64     = "0.23"
uuid       = { workspace = true }
chrono     = { workspace = true }
thiserror  = { workspace = true }
