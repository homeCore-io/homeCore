[package]
name    = "hc-api"
version = "0.1.4"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
axum       = { workspace = true }
tokio      = { workspace = true }
# Outbound fetch for the media-art proxy (see handlers::device_media_art).
reqwest    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
tracing    = { workspace = true }
hc-types   = { path = "../hc-types", features = ["schema"] }
hc-config  = { path = "../hc-config", features = ["descriptor"] }
hc-notify  = { path = "../hc-notify" }
hc-state   = { path = "../hc-state" }
hc-core    = { version = "0.1.0", path = "../hc-core" }
hc-time    = { path = "../hc-time" }
tower-http = { version = "0.7", features = ["cors", "trace"] }
uuid = { workspace = true, features = ["v4", "serde"] }
hc-auth = { version = "0.1.0", path = "../hc-auth" }
hc-api-types = { path = "../hc-api-types" }
chrono = { workspace = true, features = ["serde"] }
hc-mqtt-client = { version = "0.1.0", path = "../hc-mqtt-client" }
hc-scripting = { version = "0.1.0", path = "../hc-scripting" }
hc-topic-map = { version = "0.1.0", path = "../hc-topic-map" }
hc-web-admin = { version = "0.1.0", path = "../hc-web-admin" }
async-trait  = { workspace = true }
hc-logging   = { version = "0.1.0", path = "../hc-logging" }
ipnet        = { workspace = true }
toml         = { workspace = true }
toml_edit    = "0.22"
ron          = { workspace = true }
notify       = { workspace = true }
prometheus   = { workspace = true }
zip          = { version = "2", default-features = false, features = ["deflate"] }
tar          = "0.4"
zstd         = "0.13"
tempfile     = "3"
# 2, not 3, deliberately. jsonwebtoken 11 depends on ed25519-dalek 2 for its
# EdDSA support, so asking for 3 here does not replace that copy — it adds a
# second one, and the binary carries two curve25519 implementations. Move both
# together when jsonwebtoken does. Same reasoning as crossterm/ratatui.
ed25519-dalek = "2"
base64       = "0.23"
# 0.10 to match what jsonwebtoken's ed25519-dalek 2 already pulls in; 0.11
# would add a second digest stack for one SHA-256 helper. Moves with the above.
sha2         = "0.10"
hex          = "0.4"
hyper        = { version = "1", features = ["server", "http1"] }
hyper-util   = { version = "0.1", features = ["tokio", "server-auto"] }
tower        = { version = "0.5", features = ["util"] }
nix          = { version = "0.29", features = ["user", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
tower        = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
