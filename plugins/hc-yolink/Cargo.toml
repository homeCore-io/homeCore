[package]
name        = "hc-yolink"
version     = "0.1.12"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "YoLink door, motion and temperature sensors, over the YoLink cloud MQTT service"
repository  = "https://github.com/homeCore-io/hc-yolink"

[[bin]]
name = "hc-yolink"
path = "src/main.rs"

[dependencies]
schemars         = { version = "1", optional = true }
plugin-sdk-rs    = { path = "../../sdk/rust" }
tokio            = { version = "1",    features = ["full"] }
rumqttc          = "0.25"
reqwest          = { version = "0.13", features = ["json", "form"] }
serde            = { version = "1",    features = ["derive"] }
serde_json       = "1"
toml             = "1"
anyhow           = "1"
thiserror        = "2"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = { workspace = true }
flate2           = "1"
uuid             = { version = "1",    features = ["v4"] }
chrono           = { version = "0.4",  features = ["serde"] }

[features]
default = ["schema"]
schema = ["dep:schemars", "plugin-sdk-rs/schema"]
