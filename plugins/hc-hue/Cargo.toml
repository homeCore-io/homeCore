[package]
name        = "hc-hue"
version     = "0.1.8"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Philips Hue plugin for homeCore"
repository  = "https://github.com/homeCore-io/hc-hue"

[[bin]]
name = "hc-hue"
path = "src/main.rs"

[dependencies]
plugin-sdk-rs      = { path = "../../sdk/rust" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
flate2           = "1"
chrono           = "0.4"
schemars         = { version = "1", optional = true }

[features]
# On by default so the shipped plugin publishes its config JSON Schema to core
# (→ the config editor renders a typed form). Build --no-default-features to drop
# the schemars dependency for a lean build.
default = ["schema"]
schema  = ["dep:schemars", "plugin-sdk-rs/schema"]
