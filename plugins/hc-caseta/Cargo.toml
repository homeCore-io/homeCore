[package]
name        = "hc-caseta"
version     = "0.1.11"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Lutron Caseta dimmers, switches and Pico remotes, via a Smart Bridge Pro over LIP"
repository  = "https://github.com/homeCore-io/hc-caseta"

[[bin]]
name = "hc-caseta"
path = "src/main.rs"

[dependencies]
schemars           = { version = "1", optional = true }
plugin-sdk-rs      = { path = "../../sdk/rust" }
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "1"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = { workspace = true }
flate2           = "1"
chrono           = "0.4"
uuid         = { version = "1", features = ["v4"] }

[features]
default = ["schema"]
schema = ["dep:schemars", "plugin-sdk-rs/schema"]
