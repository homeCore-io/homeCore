[package]
name        = "hc-plugin-template"
version     = "0.1.1"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Starting point for a homeCore plugin"
repository  = "https://github.com/homeCore-io/hc-plugin-template"

[[bin]]
name = "hc-plugin-template"
path = "src/main.rs"

[dependencies]
# Pin the SDK by tag. It re-exports core's `hc-types`, which is the plugin
# ABI, so an unpinned dep means your build changes when core does.
plugin-sdk-rs      = { path = "../../sdk/rust" }
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
