[package]
name        = "hc-sonos"
version     = "0.1.9"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Sonos speaker plugin for homeCore"
repository  = "https://github.com/homeCore-io/hc-sonos"

[[bin]]
name = "hc-sonos"
path = "src/main.rs"

[dependencies]
schemars           = { version = "0.8", optional = true }
plugin-sdk-rs      = { git = "https://github.com/homeCore-io/hc-plugin-sdk-rs", tag = "v0.4.0" }
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender   = "0.2"
flate2             = "1"
chrono             = "0.4"
sonor              = "2.0"
futures            = "0.3"
axum               = "0.7"
tower              = "0.5"
tower-http         = { version = "0.7", features = ["cors", "trace"] }
roxmltree          = "0.18"

[features]
default = ["schema"]
schema = ["dep:schemars", "plugin-sdk-rs/schema"]
