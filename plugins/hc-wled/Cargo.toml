[package]
name        = "hc-wled"
version     = "0.1.10"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "WLED LED controller plugin for homeCore"
repository  = "https://github.com/homeCore-io/hc-wled"

[[bin]]
name = "hc-wled"
path = "src/main.rs"

[features]
default = ["schema"]
# Publishes the operator-config JSON Schema on the capability manifest so the
# hc-web editor renders a typed form. Off = leaner build, no schemars.
schema = ["dep:schemars", "plugin-sdk-rs/schema"]

[dependencies]
schemars           = { version = "1", optional = true }
plugin-sdk-rs      = { path = "../../sdk/rust" }
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender   = "0.2"
flate2             = "1"
chrono             = "0.4"
reqwest            = { version = "0.13", features = ["json"] }
tokio-tungstenite  = { version = "0.24", features = ["connect"] }
futures-util       = "0.3"
mdns-sd            = "0.11"
