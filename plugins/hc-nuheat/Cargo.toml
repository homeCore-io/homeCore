[package]
name        = "hc-nuheat"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "NuHeat Signature floor-heating thermostats, via the NuHeat OpenAPI"
repository  = "https://github.com/homeCore-io/homeCore"

[[bin]]
name = "hc-nuheat"
path = "src/main.rs"

[features]
default = ["schema"]
# Publishes the operator-config JSON Schema on the capability manifest so the
# hc-web editor renders a typed form. Off = leaner build, no schemars.
schema = ["dep:schemars", "plugin-sdk-rs/schema"]

[dependencies]
plugin-sdk-rs      = { path = "../../sdk/rust" }
schemars           = { version = "1", optional = true }
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender   = { workspace = true }
chrono             = "0.4"
reqwest            = { workspace = true }
urlencoding        = "2"
sha2               = "0.10"
base64             = "0.23"
rand               = { workspace = true }
thiserror          = { workspace = true }
