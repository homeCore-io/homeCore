[package]
name        = "hc-thermostat"
version     = "0.1.12"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Virtual thermostat plugin for homeCore — aggregates temperature sensors, applies hysteresis + short-cycle protection, drives an actuator device on/off"
repository  = "https://github.com/homeCore-io/hc-thermostat"

[[bin]]
name = "hc-thermostat"
path = "src/main.rs"

[dependencies]
schemars           = { version = "1", optional = true }
plugin-sdk-rs      = { path = "../../sdk/rust" }
tokio              = { version = "1",   features = ["full"] }
rumqttc            = "0.25"
serde              = { version = "1",   features = ["derive"] }
serde_json         = "1"
toml               = "1"
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender   = { workspace = true }
notify             = "8"
chrono             = { version = "0.4", features = ["serde"] }
flate2             = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["schema"]
schema = ["dep:schemars", "plugin-sdk-rs/schema"]
