[package]
name        = "hc-roku"
version     = "0.1.4"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Roku streaming player / Roku TV plugin for homeCore (External Control Protocol)"
repository  = "https://github.com/homeCore-io/hc-roku"

[[bin]]
name = "hc-roku"
path = "src/main.rs"

[features]
default = ["schema"]
# Publishes the operator-config JSON Schema on the capability manifest so the
# hc-web editor renders a typed form. Off = leaner build, no schemars.
schema = ["dep:schemars", "plugin-sdk-rs/schema"]

[dependencies]
schemars           = { version = "1", optional = true }
plugin-sdk-rs      = { path = "../../sdk/rust" }
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender   = "0.2"
flate2             = "1"
chrono             = "0.4"
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roxmltree          = "0.18"
futures-util       = "0.3"
